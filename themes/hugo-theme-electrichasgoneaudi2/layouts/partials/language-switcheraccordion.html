<div class="list-group">
  {{- $currentPage := . -}}
  {{- if hugo.IsMultilingual -}}
    {{- range .AllTranslations -}}
  <a href="{{ .RelPermalink }}" class="list-group-item flex items-center">
    <img src="/images/{{ .Language }}.svg" width="20" class="mr-2" alt="Language flag" /> 
    {{ .Language.LanguageName }}{{- if eq .Language.Lang $currentPage.Language.Lang }} ✓{{- end -}}
  </a>
  {{- end -}}
  {{- end -}}
</div>
