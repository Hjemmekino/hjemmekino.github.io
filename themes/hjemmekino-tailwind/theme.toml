# theme.toml template for a Hugo theme
# See https://github.com/spf13/hugoThemes#themetoml for an example

name = "hjemmekino-tailwind"
license = "MIT"
licenselink = "https://github.com/Hjemmekino/hjemmekino.github.io/blob/main/LICENSE.md"
description = "Hjemmekino theme for Hugo with Tailwind CSS"
homepage = "https://hjemmekino.no"
repo = "https://github.com/Hjemmekino/hjemmekino.github.io"
tags = ["hjemmekino", "tailwind", "responsive", "modern"]
features = ["documentation","menu","nested sections","search","slide", "attachments"]
min_version = "0.121.2"

[author]
  name = "evkx"
  homepage = "https://evkx.net"

[original]
  name = "Docdock"
  homepage = "https://docdock.netlify.com/"
  repo = "https://github.com/vjeantet/hugo-theme-docdock"
  licenselink = "https://github.com/vjeantet/hugo-theme-docdock/blob/master/LICENSE.md"