<header class="sticky-top bg-gray-900">
  <div class="container">
    <nav class="bg-gray-900 border-b border-gray-600" data-theme="dark">
      <div class="flex items-center justify-between h-16 px-4">
        <a class="navbar-brand" href="{{ with .Site.GetPage `/`}}{{.RelPermalink}}{{end}}">
          <img class="h-8 w-auto" src="/images/logohjemmekino_small.png" alt="EHGA logo">
        </a>
        
        <!-- Desktop Navigation -->
        <div class="hidden lg:block">
          <div class="flex items-center space-x-4">
            <a class="nav-link" href="{{ with .Site.GetPage `/models/`}}{{.RelPermalink}}{{end}}">
              {{ T "menu-models"}}
            </a>
            <a class="nav-link" href="{{ with .Site.GetPage `/technology/`}}{{.RelPermalink}}{{end}}">
              {{ T "menu-technology"}}
            </a>
            <a class="nav-link" href="{{ with .Site.GetPage `/guides/`}}{{.RelPermalink}}{{end}}">           
              {{ T "menu-guides"}} 
            </a>
            <a class="nav-link" href="{{ with .Site.GetPage `/articles/`}}{{.RelPermalink}}{{end}}">
              {{ T "menu-articles"}}
            </a>
          </div>
        </div>
        
        <!-- Mobile menu button -->
        <button type="button" class="lg:hidden btn btn-outline-dark" onclick="toggleMobileMenu()" aria-label="Toggle navigation"> 
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
      
      <!-- Mobile Navigation -->
      <div id="mobile-menu" class="lg:hidden hidden">
        <div class="px-2 pt-2 pb-3 space-y-1 bg-gray-800">
          <a class="nav-link block" href="{{ with .Site.GetPage `/models/`}}{{.RelPermalink}}{{end}}">
            {{ T "menu-models"}}
          </a>
          <a class="nav-link block" href="{{ with .Site.GetPage `/technology/`}}{{.RelPermalink}}{{end}}">
            {{ T "menu-technology"}}
          </a>
          <a class="nav-link block" href="{{ with .Site.GetPage `/guides/`}}{{.RelPermalink}}{{end}}">           
            {{ T "menu-guides"}} 
          </a>
          <a class="nav-link block" href="{{ with .Site.GetPage `/articles/`}}{{.RelPermalink}}{{end}}">
            {{ T "menu-articles"}}
          </a>
        </div>
      </div>
    </nav>
  </div>
</header>

<script>
function toggleMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  menu.classList.toggle('hidden');
}
</script>
